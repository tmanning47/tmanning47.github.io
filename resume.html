<html>
	<head>
		<title>Travis W Manning : No Sidebar</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
	</head>
	<body class="is-preload">
		<div id="page-wrapper">

			<!-- Header -->
				<div id="header">

					<!-- Logo -->
						<h1><a href="index.html" id="logo">Travis Manning <em> - Projects and Resources</em></a></h1>

										<!-- Nav -->
						<div id="nav-placeholder"></div> <!-- 	nav insert via nav.html and script -->

				</div>

			<!-- Main -->
				<section class="wrapper style1">
					<div class="container">
						<div id="content">

							<!-- Content -->
								<iframe src="resume.pdf" style="width: 100%; height: 1200px; border: none;"></iframe>
								<canvas id="pdfCanvas"></canvas>

								
	
            <div id="footer"></div> <!-- footer insert via footer.html and script -->

		</div>

		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/jquery.dropotron.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>
            <script>
                fetch('footer.html')
                .then(response => response.text())
                .then(data => {
                  document.getElementById('footer').innerHTML = data;
                });
            </script>
			<script>
				var url = 'resume.pdf';  // Replace with your PDF file path
				var pdfjsLib = window['pdfjs-dist/build/pdf'];

				pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';

				pdfjsLib.getDocument(url).promise.then(function(pdf) {
					pdf.getPage(1).then(function(page) {
						var viewport = page.getViewport({ scale: 1.5 }); // Adjust scale if needed
						var canvas = document.getElementById('pdfCanvas');
						var context = canvas.getContext('2d');

						canvas.width = viewport.width;
						canvas.height = viewport.height;

						var renderContext = {
							canvasContext: context,
							viewport: viewport
						};
						page.render(renderContext);
					});
				});
			</script>

            <!-- Nav only need one -->
            <script src="nav.js"></script>
            <script src="../nav.js"></script>
	</body>
</html>
